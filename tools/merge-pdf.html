.pdf-card:hover{border-color:var(--accent)}
.pdf-card.dragging{opacity:.4;border-color:var(--accent)}
.pdf-card .pdf-icon{font-size:2rem;margin-bottom:4px}
.pdf-card .pdf-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}
.pdf-card .pdf-pages{font-size:.75rem;color:var(--muted)}
.pdf-card .order{position:absolute;top:4px;left:4px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;font-size:.7rem;font-weight:700}
.pdf-card .remove-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}

<div class="tool-header">
<h1 class="t-green"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg> Merge PDF</h1>
<p class="tool-desc">Combine multiple PDF files into one. Drag to reorder before merging.</p>
</div>

<div class="card" id="uploadSection">
<div class="file-upload" id="dropZone">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
<p style="color:var(--muted);margin-top:12px;font-size:.95rem">Drag & drop your PDFs here or <label for="fileInput" style="color:var(--accent);cursor:pointer;font-weight:600">browse</label></p>
<p style="color:var(--muted);font-size:.8rem;margin-top:4px">Select multiple PDF files to merge</p>
<input type="file" id="fileInput" accept=".pdf" multiple style="display:none" onchange="handleFiles(this)">
</div>
</div>

<div class="card" id="optionsSection" style="display:none">
<div id="pdfCount" style="font-size:.9rem;color:var(--muted);margin:8px 0"></div>
<div id="pdfList" class="pdf-list"></div>
<div class="progress-bar" id="progressBar" style="display:none"><div class="fill" id="progressFill"></div></div>
<div class="btn-group">
<button class="btn btn-primary" onclick="mergePDFs()" id="mergeBtn">Merge PDFs</button>
</div>

</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> <span id="toastMsg">Done!</span></div></div>

<script>
function showToast(msg){document.getElementById('toastMsg').textContent=msg||'Done!';const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

const{PDFDocument}=PDFLib;
let pdfFiles=[];
let pdfMeta=[];
let dragSrcEl=null;

const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');handleDroppedFiles(e.dataTransfer.files)});
dropZone.addEventListener('click',e=>{if(e.target.tagName!=='LABEL')document.getElementById('fileInput').click()});

function handleFiles(el){if(el.files.length)addFiles(Array.from(el.files))}
function handleDroppedFiles(files){
const valid=Array.from(files).filter(f=>f.name.toLowerCase().endsWith('.pdf'));
if(valid.length===0){showToast('Please select PDF files');return}
addFiles(valid);
}

async function addFiles(files){
for(const file of files){
pdfFiles.push(file);
try{
const bytes=await file.arrayBuffer();
const pdf=await PDFDocument.load(bytes);
pdfMeta.push({name:file.name,pages:pdf.getPageIndices().length,size:file.size});
}catch(e){
pdfMeta.push({name:file.name,pages:'?',size:file.size});
}
}
renderPdfList();
document.getElementById('optionsSection').style.display='block';
document.getElementById('pdfCount').textContent=`${pdfFiles.length} PDF${pdfFiles.length!==1?'s':''} added`;
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
return (bytes/1048576).toFixed(1)+' MB';
}

function renderPdfList(){
const list=document.getElementById('pdfList');
list.innerHTML='';
pdfMeta.forEach((meta,idx)=>{
const card=document.createElement('div');
card.className='pdf-card';
card.draggable=true;
card.dataset.idx=idx;
card.innerHTML=`<span class="order">${idx+1}</span><button class="remove-btn" onclick="removePdf(${idx})">&times;</button><div class="pdf-icon">📄</div><div class="pdf-name" title="${meta.name}">${meta.name}</div><div class="pdf-pages">${meta.pages} page${meta.pages!==1?'s':''} &middot; ${formatSize(meta.size)}</div>`;

card.addEventListener('dragstart',e=>{
dragSrcEl=card;
card.classList.add('dragging');
e.dataTransfer.effectAllowed='move';
e.dataTransfer.setData('text/plain',idx);
});
card.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
card.addEventListener('drop',e=>{
e.preventDefault();
const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
const toIdx=idx;
if(fromIdx!==toIdx){
const fItem=pdfFiles.splice(fromIdx,1)[0];
const mItem=pdfMeta.splice(fromIdx,1)[0];
pdfFiles.splice(toIdx,0,fItem);
pdfMeta.splice(toIdx,0,mItem);
renderPdfList();
}
});
card.addEventListener('dragend',()=>card.classList.remove('dragging'));

list.appendChild(card);
});
}

function removePdf(idx){
pdfFiles.splice(idx,1);
pdfMeta.splice(idx,1);
if(pdfFiles.length===0)document.getElementById('optionsSection').style.display='none';
document.getElementById('pdfCount').textContent=`${pdfFiles.length} PDF${pdfFiles.length!==1?'s':''} added`;
renderPdfList();
}

async function mergePDFs(){
if(pdfFiles.length<2){showToast('Add at least 2 PDFs to merge');return}
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
progressBar.style.display='block';
progressFill.style.width='0%';
document.getElementById('mergeBtn').disabled=true;

try{
const merged=await PDFDocument.create();
for(let i=0;i<pdfFiles.length;i++){
const bytes=await pdfFiles[i].arrayBuffer();
const pdf=await PDFDocument.load(bytes);
const pages=await merged.copyPages(pdf,pdf.getPageIndices());
pages.forEach(p=>merged.addPage(p));
progressFill.style.width=`${((i+1)/pdfFiles.length)*100}%`;
}

const mergedBytes=await merged.save();
const blob=new Blob([mergedBytes],{type:'application/pdf'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download='merged.pdf';
a.click();URL.revokeObjectURL(url);
progressBar.style.display='none';
document.getElementById('mergeBtn').disabled=false;
showToast('PDFs merged successfully!');
}catch(err){
progressBar.style.display='none';
document.getElementById('mergeBtn').disabled=false;
showToast('Error merging PDFs');
console.error(err);
}
}
