<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free GST Calculator - Calculate GST Online</title>
  <meta name="description" content="Free online GST calculator. Calculate CGST, SGST, IGST for any GST rate in India.">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8427860023135459" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="nav"><div class="container"><a href="/" class="logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>FreeOnlineTools</span></a><div class="nav-links"><a href="/#text">Text</a><a href="/#encoding">Encoding</a><a href="/#dev">Developer</a><a href="/#calc">Calculators</a><a href="/#seo">SEO</a></div><button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div></nav>

  <div class="tool-page">
    <a href="/" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>

    <h1><div class="tool-page-icon t-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div> GST Calculator</h1>
    <p class="desc">Calculate GST (CGST + SGST or IGST) for any product in India.</p>

    <div class="tool-box">
      <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg> Original Price (₹):</label><input type="number" id="price" placeholder="e.g. 1000" oninput="calcGST()">
      <label style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> GST Rate (%):</label>
      <select id="rate" onchange="calcGST()">
        <option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option>
      </select>
    </div>

    <div class="stat-grid" id="resultArea" style="display:none">
      <div class="stat-box"><div class="num" id="gstAmount">₹0</div><div class="label">GST Amount</div></div>
      <div class="stat-box"><div class="num" id="totalPrice">₹0</div><div class="label">Total Price</div></div>
      <div class="stat-box"><div class="num" id="cgst">₹0</div><div class="label">CGST</div></div>
      <div class="stat-box"><div class="num" id="sgst">₹0</div><div class="label">SGST</div></div>
    </div>

    <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8427860023135459" data-ad-slot="1212121212" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})</script></div>
  </div>

  <footer class="footer"><div class="footer-bottom"><p>&copy; 2026 FreeOnlineTools. All tools run in your browser.</p></div></footer>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Copied to clipboard!</div>

  <script>
  function copyToClipboard(id){
    const text=document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
  function calcGST(){
    const p=parseFloat(document.getElementById('price').value);
    const r=parseFloat(document.getElementById('rate').value);
    if(p>0){
      const gst=p*r/100;const total=p+gst;
      document.getElementById('resultArea').style.display='grid';
      document.getElementById('gstAmount').textContent='₹'+Math.round(gst).toLocaleString();
      document.getElementById('totalPrice').textContent='₹'+Math.round(total).toLocaleString();
      document.getElementById('cgst').textContent='₹'+Math.round(gst/2).toLocaleString();
      document.getElementById('sgst').textContent='₹'+Math.round(gst/2).toLocaleString();
    }
  }
  </script>
</body>
</html>
