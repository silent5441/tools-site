<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Free online compound interest calculator. Calculate returns on your investments.">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8427860023135459" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="nav"><div class="container"><a href="../" class="logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span>FreeOnlineTools</span></a><div class="nav-right"><div class="nav-links"><a href="../#text">Text</a><a href="../#encoding">Encoding</a><a href="../#dev">Developer</a><a href="../#calc">Calculators</a><a href="../#seo">SEO</a></div><div class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div><button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div></nav>

  <div class="tool-page">
    <a href="../" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>

    <h1><div class="tool-page-icon t-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div> Compound Interest Calculator</h1>
    <p class="desc">Calculate compound interest and see how your money grows over time.</p>

    <div class="tool-box">
      <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg> Principal Amount (₹):</label><input type="number" id="principal" placeholder="e.g. 100000" oninput="calcCI()">
      <label style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Annual Interest Rate (%):</label><input type="number" id="rate" placeholder="e.g. 10" step="0.1" oninput="calcCI()">
      <label style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Time Period (years):</label><input type="number" id="time" placeholder="e.g. 10" oninput="calcCI()">
      <label style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg> Compounding:</label>
      <select id="compound" onchange="calcCI()">
        <option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option>
      </select>
    </div>

    <div class="stat-grid" id="resultArea" style="display:none">
      <div class="stat-box"><div class="num" id="totalAmount">₹0</div><div class="label">Total Amount</div></div>
      <div class="stat-box"><div class="num" id="interestEarned" style="color:var(--green)">₹0</div><div class="label">Interest Earned</div></div>
      <div class="stat-box"><div class="num" id="growthPct">0%</div><div class="label">Total Growth</div></div>
    </div>

    <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8427860023135459" data-ad-slot="1515151515" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})</script></div>
  </div>

  <footer class="footer"><div class="footer-bottom"><p>&copy; 2026 FreeOnlineTools. All tools run in your browser.</p></div></footer>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Copied to clipboard!</div>

  <script>
  function copyToClipboard(id){
    const text=document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
  function calcCI(){
    const P=parseFloat(document.getElementById('principal').value);
    const r=parseFloat(document.getElementById('rate').value)/100;
    const t=parseFloat(document.getElementById('time').value);
    const n=parseInt(document.getElementById('compound').value);
    if(P>0&&r>0&&t>0){
      const A=P*Math.pow(1+r/n,n*t);
      const I=A-P;
      document.getElementById('resultArea').style.display='grid';
      document.getElementById('totalAmount').textContent='₹'+Math.round(A).toLocaleString();
      document.getElementById('interestEarned').textContent='₹'+Math.round(I).toLocaleString();
      document.getElementById('growthPct').textContent=((I/P)*100).toFixed(1)+'%';
    }
  }
  </script>
</body>
</html>
