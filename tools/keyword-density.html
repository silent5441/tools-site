  <div class="tool-page">
    <a href="../" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>

    <h1><div class="tool-page-icon t-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div> Keyword Density Checker</h1>
    <p class="desc">Analyze keyword frequency and density in your content.</p>

    <div class="tool-box"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2z"/><path d="M9 7h6M9 12h6M9 17h4"/></svg> Paste your content:</label><textarea id="input" placeholder="Paste your article or blog post here..." oninput="analyzeDensity()"></textarea></div>
    <div class="tool-box"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Top Keywords by Frequency:</label><div class="result-box" id="result" style="min-height:150px"></div></div>

    <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8427860023135459" data-ad-slot="2626262626" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})</script></div>
  </div>

  <footer class="footer"><div class="footer-bottom"><p>&copy; 2026 FreeOnlineTools. All tools run in your browser.</p></div></footer>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Copied to clipboard!</div>

  <script>
  function copyToClipboard(id){
    const text=document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
  function analyzeDensity(){
    const text=document.getElementById('input').value.toLowerCase();
    const words=text.match(/\b[a-z]{3,}\b/g);
    if(!words||words.length===0){document.getElementById('result').textContent='Enter text to analyze';return}
    const freq={};words.forEach(w=>{freq[w]=(freq[w]||0)+1});
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20);
    const total=words.length;
    let html=`Total words: ${total}\n\nWord | Count | Density\n${'─'.repeat(40)}\n`;
    sorted.forEach(([w,c])=>{html+=`${w.padEnd(20)} ${String(c).padStart(5)}    ${((c/total)*100).toFixed(2)}%\n`});
    document.getElementById('result').textContent=html;
  }
  </script>
