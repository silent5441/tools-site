.progress-bar .fill{height:100%;background:var(--gradient);border-radius:4px;transition:width 0.3s;width:0%}
.page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}
.page-thumb{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.page-thumb:hover{border-color:var(--accent)}
.page-thumb.selected{border-color:var(--green);background:rgba(0,184,148,0.1)}
.page-thumb canvas,.page-thumb img{width:100%;border-radius:4px}
.page-num{font-size:.8rem;color:var(--muted);margin-top:4px}
.page-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.page-thumb:hover .page-remove{opacity:1}
.options-row{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;align-items:center}
.options-row label{font-weight:600;font-size:.9rem}
.options-row select{padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem}
.btn-group{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.image-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:16px 0}
.image-card{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px;text-align:center;position:relative;cursor:grab;transition:all .2s}
.image-card:hover{border-color:var(--accent)}
.image-card.dragging{opacity:.4;border-color:var(--accent)}
.image-card img{width:100%;height:100px;object-fit:cover;border-radius:4px}
.image-card .name{font-size:.75rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-card .order{position:absolute;top:4px;left:4px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;font-size:.7rem;font-weight:700}
.image-card .remove-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.image-card:hover .remove-btn{opacity:1}
</style>

<h1 class="t-purple"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg> Image to PDF</h1>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> <span id="toastMsg">Done!</span></div></div>

<script>
function showToast(msg){document.getElementById('toastMsg').textContent=msg||'Done!';const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

let imageFiles=[];
let dragSrcEl=null;

const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');handleDroppedFiles(e.dataTransfer.files)});
dropZone.addEventListener('click',e=>{if(e.target.tagName!=='LABEL')document.getElementById('fileInput').click()});

function handleFiles(el){if(el.files.length)addFiles(Array.from(el.files))}
function handleDroppedFiles(files){addFiles(Array.from(files))}

function addFiles(files){
const imageTypes=['image/jpeg','image/png','image/gif','image/bmp','image/webp'];
const valid=files.filter(f=>imageTypes.includes(f.type));
if(valid.length===0){showToast('Please select image files');return}
valid.forEach(f=>imageFiles.push(f));
renderImageList();
document.getElementById('optionsSection').style.display='block';
document.getElementById('imageCount').textContent=`${imageFiles.length} image${imageFiles.length!==1?'s':''} added`;
}

function renderImageList(){
const list=document.getElementById('imageList');
list.innerHTML='';
imageFiles.forEach((file,idx)=>{
const card=document.createElement('div');
card.className='image-card';
card.draggable=true;
card.dataset.idx=idx;

const reader=new FileReader();
reader.onload=e=>{
card.innerHTML=`<span class="order">${idx+1}</span><button class="remove-btn" onclick="removeImage(${idx})">&times;</button><img src="${e.target.result}" alt="${file.name}" loading="lazy" decoding="async" onload="this.setAttribute('width',this.naturalWidth);this.setAttribute('height',this.naturalHeight)"><div class="name" title="${file.name}">${file.name}</div>`;
};
reader.readAsDataURL(file);

card.addEventListener('dragstart',e=>{
dragSrcEl=card;
card.classList.add('dragging');
e.dataTransfer.effectAllowed='move';
e.dataTransfer.setData('text/plain',idx);
});
card.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
card.addEventListener('drop',e=>{
e.preventDefault();
const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
const toIdx=idx;
if(fromIdx!==toIdx){
const item=imageFiles.splice(fromIdx,1)[0];
imageFiles.splice(toIdx,0,item);
renderImageList();
}
});
card.addEventListener('dragend',()=>{card.classList.remove('dragging')});

list.appendChild(card);
});
}

function removeImage(idx){
imageFiles.splice(idx,1);
if(imageFiles.length===0)document.getElementById('optionsSection').style.display='none';
document.getElementById('imageCount').textContent=`${imageFiles.length} image${imageFiles.length!==1?'s':''} added`;
renderImageList();
}

function getPageDimensions(pageSize){
switch(pageSize){
case'a4':return{w:595.28,h:841.89};
case'letter':return{w:612,h:792};
default:return null;
}
}

async function loadImageToDataUrl(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=e=>resolve(e.target.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});
}

async function generatePDF(){
if(imageFiles.length===0)return;
const pageSize=document.getElementById('pageSizeSelect').value;
const orientation=document.getElementById('orientationSelect').value;
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
progressBar.style.display='block';
progressFill.style.width='0%';
document.getElementById('generateBtn').disabled=true;

const{jsPDF}=window.jspdf;

try{
if(pageSize==='fit'){
const firstDataUrl=await loadImageToDataUrl(imageFiles[0]);
const firstImg=new Image();
await new Promise(r=>{firstImg.onload=r;firstImg.src=firstDataUrl});
const orient=firstImg.width>firstImg.height?'landscape':'portrait';
const doc=new jsPDF({orientation:orient,unit:'px',format:[firstImg.width,firstImg.height]});
doc.addImage(firstDataUrl,'JPEG',0,0,firstImg.width,firstImg.height);
progressFill.style.width=`${(1/imageFiles.length)*100}%`;

for(let i=1;i<imageFiles.length;i++){
const dataUrl=await loadImageToDataUrl(imageFiles[i]);
const img=new Image();
await new Promise(r=>{img.onload=r;img.src=dataUrl});
const o=img.width>img.height?'landscape':'portrait';
doc.addPage([img.width,img.height],o);
doc.addImage(dataUrl,'JPEG',0,0,img.width,img.height);
progressFill.style.width=`${((i+1)/imageFiles.length)*100}%`;
}
doc.save('images.pdf');
}else{
const dims=getPageDimensions(pageSize);
const doc=new jsPDF({orientation:'portrait',unit:'pt',format:pageSize});

for(let i=0;i<imageFiles.length;i++){
if(i>0)doc.addPage();
const dataUrl=await loadImageToDataUrl(imageFiles[i]);
const img=new Image();
await new Promise(r=>{img.onload=r;img.src=dataUrl});

let pageW,pageH;
if(orientation==='auto'){
const land=img.width>img.height;
pageW=land?dims.h:dims.w;
pageH=land?dims.w:dims.h;
if(land&&i===0)doc.deletePage(0),doc.addPage(pageSize,'landscape');
}else if(orientation==='landscape'){
pageW=dims.h;pageH=dims.w;
if(i===0)doc.deletePage(0),doc.addPage(pageSize,'landscape');
}else{
pageW=dims.w;pageH=dims.h;
}

const margin=20;
const availW=pageW-margin*2;
const availH=pageH-margin*2;
const scale=Math.min(availW/img.width,availH/img.height,1);
const w=img.width*scale;
const h=img.height*scale;
const x=(pageW-w)/2;
const y=(pageH-h)/2;

doc.addImage(dataUrl,'JPEG',x,y,w,h);
progressFill.style.width=`${((i+1)/imageFiles.length)*100}%`;
}
doc.save('images.pdf');
}
progressBar.style.display='none';
document.getElementById('generateBtn').disabled=false;
showToast('PDF generated successfully!');
}catch(err){
progressBar.style.display='none';
document.getElementById('generateBtn').disabled=false;
showToast('Error generating PDF');
console.error(err);
}
}
