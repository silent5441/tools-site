    <a href="../" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>

    <h1><div class="tool-page-icon t-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div> Meta Tag Analyzer</h1>
    <p class="desc">Paste your HTML to analyze meta tags for SEO optimization.</p>

    <div class="tool-box"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Paste your HTML code:</label><textarea id="input" placeholder="<title>My Page Title</title>\n<meta name='description' content='...'>\n<meta name='keywords' content='...'>" style="min-height:200px"></textarea></div>
    <div class="btn-group"><button class="btn btn-primary" onclick="analyzeMeta()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Analyze</button></div>

  <footer class="footer"><div class="footer-bottom"><p>&copy; 2026 FreeOnlineTools. All tools run in your browser.</p></div></footer>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Copied to clipboard!</div>

  <script>
  function copyToClipboard(id){
    const text=document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
  function analyzeMeta(){
    const html=document.getElementById('input').value;
    const parser=new DOMParser();const doc=parser.parseFromString(html,'text/html');
    const title=doc.querySelector('title')?.textContent||'';
    const desc=doc.querySelector('meta[name="description"]')?.getAttribute('content')||'';
    const kw=doc.querySelector('meta[name="keywords"]')?.getAttribute('content')||'';
    const canonical=doc.querySelector('link[rel="canonical"]')?.getAttribute('href')||'';
    let html2='';
    const check=(label,value,recommended,actual)=>{
      const len=actual.length;const ok=len>=recommended[0]&&len<=recommended[1];
      html2+=`<div class="stat-box" style="text-align:left;padding:16px;margin:8px 0"><div style="display:flex;justify-content:space-between"><strong>${label}</strong><span style="color:${ok?'var(--green)':'var(--red)'}">${ok?'&#10003;':'&#9888;'} ${len} chars</span></div><div style="color:var(--muted);font-size:.85rem;margin-top:4px">Recommended: ${recommended[0]}-${recommended[1]} chars</div><div style="margin-top:6px;font-size:.9rem">${actual||'<em style="color:var(--red)">Missing!</em>'}</div></div>`;
    };
    check('Title',[50,60],title);
    check('Description',[150,160],desc);
    check('Keywords',[0,10],kw);
    html2+=`<div class="stat-box" style="padding:16px;margin:8px 0"><strong>Canonical URL:</strong> ${canonical||'<span style="color:var(--red)">Missing</span>'}</div>`;
    document.getElementById('results').innerHTML=html2;
  }
  </script>
</body>
