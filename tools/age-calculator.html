</head>
<body>

  <div class="tool-page">
    <a href="../" class="back-link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>

    <h1><div class="tool-page-icon t-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></div> Age Calculator</h1>
    <p class="desc">Calculate your exact age in years, months, days, and more.</p>

    <div class="tool-box">
      <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Date of Birth:</label>
      <input type="date" id="dob" onchange="calcAge()">
    </div>

    <div class="stat-grid" id="resultArea" style="display:none">
      <div class="stat-box"><div class="num" id="years">0</div><div class="label">Years</div></div>
      <div class="stat-box"><div class="num" id="months">0</div><div class="label">Months</div></div>
      <div class="stat-box"><div class="num" id="days">0</div><div class="label">Days</div></div>
      <div class="stat-box"><div class="num" id="hours">0</div><div class="label">Hours</div></div>
      <div class="stat-box"><div class="num" id="totalDays">0</div><div class="label">Total Days</div></div>
      <div class="stat-box"><div class="num" id="nextBday">--</div><div class="label">Next Birthday</div></div>
    </div>

    <div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8427860023135459" data-ad-slot="8888888888" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})</script></div>
  </div>

  <footer class="footer"><div class="footer-bottom"><p>&copy; 2026 FreeOnlineTools. All tools run in your browser.</p></div></footer>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Copied to clipboard!</div>

  <script>
  function copyToClipboard(id){
    const text=document.getElementById(id).textContent;
    navigator.clipboard.writeText(text);
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
  function calcAge(){
    const dob=new Date(document.getElementById('dob').value);
    if(isNaN(dob))return;
    const now=new Date();
    let y=now.getFullYear()-dob.getFullYear();
    let m=now.getMonth()-dob.getMonth();
    let d=now.getDate()-dob.getDate();
    if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
    if(m<0){y--;m+=12}
    const totalDays=Math.floor((now-dob)/(1000*60*60*24));
    const hours=totalDays*24;
    let nextBday=new Date(now.getFullYear(),dob.getMonth(),dob.getDate());
    if(nextBday<now)nextBday.setFullYear(nextBday.getFullYear()+1);
    const daysUntil=Math.ceil((nextBday-now)/(1000*60*60*24));
    document.getElementById('resultArea').style.display='grid';
    document.getElementById('years').textContent=y;
    document.getElementById('months').textContent=m;
    document.getElementById('days').textContent=d;
    document.getElementById('hours').textContent=hours.toLocaleString();
    document.getElementById('totalDays').textContent=totalDays.toLocaleString();
    document.getElementById('nextBday').textContent=daysUntil+' days';
  }
  </script>
</body>
</html>
